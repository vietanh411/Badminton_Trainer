name: CI

on:
  push:
    branches: [main, badmintonvision-ai]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System libraries for OpenCV / MediaPipe (MediaPipe Tasks load libEGL even on CPU)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 libegl1 libgles2
      - name: Install (CPU PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[yolo,dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: models/weights
          key: weights-v1-${{ hashFiles('scripts/download_models.py') }}
      - name: Download models
        working-directory: .
        run: python scripts/download_models.py --pose pose_landmarker_lite.task pose_landmarker_full.task
      - name: Tests
        run: pytest -q
      - name: Synthetic benchmark smoke run
        working-directory: .
        run: python scripts/run_synthetic_benchmark.py --quick --work /tmp/bv-bench

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
