[alembic]
script_location = migrations
prepend_sys_path = .
# The URL is set at runtime from BV_DATABASE_URL / BV_DATA_DIR (see app/db/session.py).
sqlalchemy.url = sqlite:///../data/badmintonvision.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
