[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "badmintonvision"
version = "0.1.0"
description = "BadmintonVision AI: badminton video analytics (court calibration, player tracking, pose, movement heatmaps)"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "opencv-python-headless>=4.10",
  "mediapipe>=0.10.18",
  "shapely>=2.0",
  "matplotlib>=3.9",
  "pyarrow>=16",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "psutil>=6.0",
  "joblib>=1.4",
]

[project.optional-dependencies]
# Ultralytics is AGPL-3.0. It is optional: the Apache-2.0 MediaPipe detector works without it.
yolo = ["ultralytics>=8.3", "torch>=2.3"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "plotly>=5.22"]

[tool.setuptools.packages.find]
include = ["app*", "vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "models: needs downloaded model weights (skipped when missing)",
  "slow: longer-running integration tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300"]
"app/services/report.py" = ["E501"]
