# Override for NVIDIA GPUs (needs the NVIDIA Container Toolkit on the host).
# YOLO detection moves to the GPU automatically; MediaPipe pose stays on CPU.
services:
  backend:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
