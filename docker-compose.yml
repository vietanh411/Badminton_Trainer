# Local deployment: http://localhost:8080 (UI) → nginx → backend:8000 (API + worker).
# Both ports bind to 127.0.0.1 so the analysis server is not exposed to your network by default.
#
#   docker compose up --build
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build   # NVIDIA GPU
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WITH_YOLO: "1"
        DOWNLOAD_MODELS: "1"
    env_file:
      - path: .env
        required: false
    environment:
      BV_DATA_DIR: /data
      BV_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
    volumes:
      - bv-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  bv-data:
